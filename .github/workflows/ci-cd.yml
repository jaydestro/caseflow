name: CI/CD

# Continuous integration only. Every push runs `test` (build + lint + the
# backend suite against the Cosmos DB emulator) and `security` (npm audit +
# CodeQL). This workflow does NOT deploy — there is no Azure identity wired to
# this repo. Deployment is left to whoever runs the project, against their own
# Azure subscription and tenant.
#
# ---------------------------------------------------------------------------
# Deploying CaseFlow to YOUR OWN Azure account
# ---------------------------------------------------------------------------
# CaseFlow deploys with the Azure Developer CLI (azd) to Azure Container Apps;
# the infra is Bicep under `infra/`, wired up by `azure.yaml`. Two options:
#
# A) Local one-shot deploy (simplest). From a clone with azd installed:
#      azd auth login        # sign into YOUR Azure account / tenant
#      azd up                # provision infra + build images in ACR + deploy
#    Re-deploy code changes later:  azd deploy   (or `azd up` after infra edits)
#    Tear everything down:          azd down
#    Images build in-cloud (ACR remote build), so Docker isn't needed locally.
#
# B) Re-enable automated deploys in YOUR fork (GitHub Actions + OIDC):
#    1. Sign in to all three CLIs as YOUR account:
#         azd auth login   &&   az login   &&   gh auth login
#    2. From the repo root, run the bootstrap (wraps
#       `azd pipeline config --provider github --auth-type federated`):
#         ./scripts/setup-cicd.sh      # macOS / Linux
#         .\scripts\setup-cicd.ps1     # Windows (PowerShell)
#       It creates an Entra app registration + OIDC federated credential,
#       assigns subscription RBAC, and sets these GitHub Actions *variables*:
#         AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#         AZURE_ENV_NAME (caseflow), AZURE_LOCATION (eastus2)
#    3. Add a deploy job to this file, gated on `test` + `security`, that runs
#       `azd auth login --federated-credential-provider github ...` then
#       `azd provision` and `azd deploy`. (See this repo's git history for a
#       reference deploy job that was removed.)
#
# NOTE: GitHub OIDC tokens from a PERSONAL-account repo carry an empty
# `enterprise` claim, so tenants that require it (e.g. the Microsoft corporate
# tenant) reject `azd auth login` with AADSTS7002381. Use a personal /
# non-restricted Azure tenant for option (B), or just use option (A) locally.
#
# Trigger on `push` only — covers feature-branch CI. No `pull_request` trigger,
# which would double-run test + security on the same SHA for commits that
# belong to an open PR.
on:
  push:
    branches: ['**']

# Cancel superseded runs on the same ref (e.g. fast successive pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # TEST — runs on every branch push.
  # Spins up the Cosmos DB vNext emulator and runs the backend test suite
  # against it (the data layer has no in-memory fallback).
  # ---------------------------------------------------------------------------
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Cosmos DB emulator (vNext preview)
        run: |
          # The vNext emulator defaults to PLAIN HTTP on 8081. Start it in HTTPS
          # mode so it matches the readiness probe and COSMOS_ENDPOINT below
          # (both https). The self-signed cert is accepted via curl -k and
          # NODE_TLS_REJECT_UNAUTHORIZED=0.
          docker run -d --name cosmos-emulator \
            -p 8081:8081 -p 1234:1234 \
            mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview \
            --protocol https

      - name: Wait for emulator to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -k -s -o /dev/null https://localhost:8081/; then
              echo "Cosmos emulator is ready."
              exit 0
            fi
            echo "Waiting for Cosmos emulator... ($i/60)"
            sleep 5
          done
          echo "::error::Cosmos emulator did not become ready in time."
          docker logs cosmos-emulator || true
          exit 1

      - name: Build
        run: npm run build

      - name: Lint backend
        run: npm run lint -w backend

      - name: Run tests
        env:
          COSMOS_ENDPOINT: https://localhost:8081
          # Emulator uses a self-signed cert; trust it for this run.
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm test

      - name: Dump emulator logs on failure
        if: failure()
        run: docker logs cosmos-emulator || true

  # ---------------------------------------------------------------------------
  # SECURITY — dependency + static analysis on every branch push.
  # Fails on known high/critical vulnerabilities in runtime dependencies and
  # runs CodeQL static analysis over the TypeScript sources.
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload CodeQL results
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Detect code scanning availability
        id: code_scanning
        uses: actions/github-script@v7
        with:
          script: |
            // Probe the code scanning API to decide whether CodeQL can upload.
            //   200 -> code scanning API available -> run CodeQL
            //   403 -> code scanning not accessible (e.g. private repo without Advanced Security) -> skip CodeQL
            //   404 -> code scanning not enabled for this repo -> skip CodeQL
            try {
              await github.request("GET /repos/{owner}/{repo}/code-scanning/alerts", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1,
              });
              core.setOutput("enabled", "true");
            } catch (error) {
              if (error.status === 403) {
                core.notice(
                  `Skipping CodeQL because code scanning is not enabled or not accessible (HTTP ${error.status}).`,
                );
                core.setOutput("enabled", "false");
              } else if (error.status === 404) {
                core.notice(
                  "Skipping CodeQL because code scanning is not enabled for this repository (HTTP 404).",
                );
                core.setOutput("enabled", "false");
              } else {
                throw error;
              }
            }

      - name: Initialize CodeQL
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Build for CodeQL
        if: steps.code_scanning.outputs.enabled == 'true'
        run: npm run build

      - name: CodeQL analysis
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v3
